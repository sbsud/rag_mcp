services:
  chromadb:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      retries: 3

  kong:
    image: kong:3.9.3
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8080:8000"

  consul:
    image: hashicorp/consul:2.0.1
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    ports:
      - "8500:8500"
    volumes:
      - consul-data:/consul/data


  embedder-service:
      build:
        context: ./embedder
        dockerfile: Dockerfile
      ports:
        - "8006:8006"

  complaints-mcp:
    build: .
    command: python mcp/mcp_server_complaints.py
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - EMBEDDER_URL=http://embedder-service:8006
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
    ports:
      - "8003:8003"
    depends_on:
      - chromadb
      - embedder-service

  policy-mcp:
    build: .
    command: python mcp/mcp_server_policy.py
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - EMBEDDER_URL=http://embedder-service:8006
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
    ports:
      - "8004:8004"
    depends_on:
      - chromadb
      - embedder-service

  github-mcp:
    build: .
    command: python mcp/mcp_server_github.py
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    ports:
      - "8005:8005"

  agent-service:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command: uvicorn agent.agent_service:app --host 0.0.0.0 --port 8080
    environment:
      - COMPLAINTS_MCP_URL=http://complaints-mcp:8003/sse
      - POLICY_MCP_URL=http://policy-mcp:8004/sse
      - GITHUB_MCP_URL=http://github-mcp:8005/sse
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
    ports:
      - "8090:8080"
    depends_on:
      - complaints-mcp
      - policy-mcp
      - github-mcp

volumes:
  chroma-data:
  consul-data:
